server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: docsearch-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docsearch}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:docsearch}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:docsearch123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 2000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 100ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}

docsearch:
  opensearch:
    shards: ${OPENSEARCH_SHARDS:3}
    replicas: ${OPENSEARCH_REPLICAS:0}
    refresh-interval: ${OPENSEARCH_REFRESH_INTERVAL:1s}
  outbox:
    poll-interval-ms: 2000

resilience4j:
  circuitbreaker:
    instances:
      opensearch:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 400ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
